# Netlify hosting. Every page is prerendered, so the site is built as static files;
# the contact/quote form posts to the function in netlify/functions/send-email.mjs.
[build]
  command = "npx ng build --output-mode=static"
  publish = "dist/palmsure-corp-v2/browser"

[build.environment]
  NODE_VERSION = "22"
  # The office email addresses are shown on the site itself (footer, contact page), so they are
  # not secrets. The Resend API key is still scanned.
  SECRETS_SCAN_OMIT_KEYS = "PALMSURE_CONTACT_EMAIL,PALMSURE_ADMIN_EMAIL"

# Any URL without its own prerendered page loads the app, which handles the route.
[[redirects]]
  from = "/*"
  to = "/index.csr.html"
  status = 200
